# Runs the Rust and UI tests on Windows and macOS for every pull request.
name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - uses: Swatinem/rust-cache@v2

      - run: npm --prefix app ci

      # the Tauri crate embeds the built UI (app/build), so it must exist before cargo builds it
      - run: npm --prefix app run build

      - run: npm --prefix app run check

      - run: npm --prefix app test

      # --no-fail-fast: one run shows every platform-specific failure, not just the first crate's
      - run: cargo test --workspace --no-fail-fast

  # TEMPORARY: dry run of release.yml's build-macos steps; remove before merging
  macos-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm --prefix app ci
      - run: npm --prefix app run build:installer
      - run: npm --prefix app run build:exe
      - name: Name the files
        run: |
          VERSION=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          ls -R target/universal-apple-darwin/release/bundle
          mkdir dist
          out=target/universal-apple-darwin/release
          cp "${out}/bundle/dmg/STL Browser_${VERSION}_universal.dmg" "dist/stl-browser_${VERSION}_universal.dmg"
          cp "${out}/stl-browser-${VERSION}-macos" dist/
          file dist/*
          lipo -info "dist/stl-browser-${VERSION}-macos"
          codesign -dv --verbose=2 "dist/stl-browser-${VERSION}-macos"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "dist/stl-browser_${VERSION}_universal.dmg"
          ls -la "$RUNNER_TEMP/dmg"
          codesign -dv --verbose=2 "$RUNNER_TEMP/dmg/STL Browser.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/dmg/STL Browser.app"
          lipo -info "$RUNNER_TEMP/dmg/STL Browser.app/Contents/MacOS/"*
          hdiutil detach "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/
          if-no-files-found: error
